spring:
  main:
    allow-circular-references: truedoc
  datasource:
    url: jdbc:postgresql://db:5432/hapi
    username: admin
    password: admin
    driverClassName: org.postgresql.Driver

  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: true
      hibernate.search.backend.type: lucene
      hibernate.search.backend.analysis.configurer: ca.uhn.fhir.jpa.search.HapiHSearchAnalysisConfigurers$HapiLuceneAnalysisConfigurer
      hibernate.search.backend.directory.type: local-filesystem
      hibernate.search.backend.directory.root: /app/target/lucene_indexes
      hibernate.search.schema_management.strategy: CREATE


hapi:
  fhir:
    fhir_version: R4
    tester:
      home:
        name: PH eReferral FHIR Server
        server_address: '${FHIR_SERVER_ADDRESS:http://localhost}:${FHIR_SERVER_PORT:8080}/fhir'
        refuse_to_fetch_third_party_urls: false
        fhir_version: R4

    mdm_enabled: true
    mdm_rules_enabled: true
    mdm_config_json: file:/app/config/mdm-rules.json
    validate_resource_status_for_package_upload: false

    enable_repository_validating_interceptor: false
    enforce_referential_integrity_on_write: true

    validation:
      requests_enabled: true
      responses_enabled: false

    subscription:
      resthook_enabled: true
      websocket_enabled: false
      email_enabled: false
    openapi_enabled: false

    logger:
      name: fhirtest.access
      format: "verb=${requestVerb} path=${servletPath} op=${operationType} opName=${operationName} resource=${idOrResourceName} remoteAddr=${remoteAddr} forwardedFor=${requestHeader.x-forwarded-for} userAgent=${requestHeader.user-agent} requestId=${requestId} params=${requestParameters} processingMs=${processingTimeMillis}"
      error_format: "verb=${requestVerb} path=${requestUrl} op=${operationType} resource=${idOrResourceName} remoteAddr=${remoteAddr} requestId=${requestId} error=${exceptionMessage}"
      log_exceptions: true

    implementationguides:
      ph_core:
        name: fhir.ph.core
        version: 0.2.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        packageUrl: https://fhirhub.telehealth.ph/IG/PH-Core/package.tgz
        fetchDependencies: false
        installResourceTypes:
          - StructureDefinition
          - SearchParameter
          - NamingSystem
          - Subscription
          # So that the passthrough validation will go to Ontoserver
          # Caveat. Longer Ping Pong validation
          # - CodeSystem
          # - ValueSets

      ph_eref:
        name: fhir.ph.ereferral
        version: 0.1.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        packageUrl: https://fhirhub.telehealth.ph/IG/PH-eReferral/package.tgz
        fetchDependencies: true
        ## Rationale: so that the preference of the Terminologies will be from tx.fhirlab.net
        ## Not from the Implementation Guide Example
        installResourceTypes:
          - StructureDefinition
          - SearchParameter
          - NamingSystem
          - Subscription
          # So that the passthrough validation will go to Ontoserver
          # Caveat. Longer Ping Pong validation 
          # - CodeSystem
          # - ValueSets

        dependencyExcludes:
          - "hl7.fhir.uv.extensions"
          - "hl7.fhir.uv.extensions.r4"
          - hl7.fhir.uv.extensions.r5
          - "hl7.terminology.r5"
          - "fhir.ph.core"
      hl7_extensions_r4:
        name: hl7.fhir.uv.extensions.r4
        version: 5.3.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        fetchDependencies: true
        installResourceTypes:
          - StructureDefinition
          - SearchParameter
        dependencyExcludes:
           - "hl7.terminology.r5"
           - "hl7.terminology.r4"
      hl7_terminology_r4:
        name: hl7.terminology.r4
        version: 6.2.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        fetchDependencies: false
        installResourceTypes:
          - CodeSystem
          - ValueSet
    logical_urls:
      - http://terminology.hl7.org/*
      - https://terminology.hl7.org/*
      - http://snomed.info/*
      - https://snomed.info/*
      - http://unitsofmeasure.org/*
      - https://unitsofmeasure.org/*
      - http://loinc.org/*
      - https://loinc.org/*
    remote_terminology_service:
      # UCUM not handled correctly on Ontoserver at the moment
      ucum:
        system: "http://loinc.org"
        url: "https://tx.fhir.org/r4"
      # The rest are routed to Ontoserver
      loinc:
        system: "http://loinc.org"
        url: "https://tx.fhirlab.net/fhir"
      snomed:
        system: "https://snomed.info/sct"
        url: "https://tx.fhirlab.net/fhir"
      phcw:
        system: "https://fhir.doh.gov.ph/phcore/CodeSystem/PHCW"
        url: "https://tx.fhirlab.net/fhir"
      psoc:
        system: "https://fhir.doh.gov.ph/phcore/CodeSystem/PSOC"
        url: "https://tx.fhirlab.net/fhir"
      psced-level:
        system: "https://psa.gov.ph/classification/psced/level"
        url: "https://tx.fhirlab.net/fhir"
      psgc:
        system: "https://psa.gov.ph/classification/psgc"
        url: "https://tx.fhirlab.net/fhir"
      psoc-unit:
        system: "https://psa.gov.ph/classification/psoc/unit"
        url: "https://tx.fhirlab.net/fhir"
      all:
        system: '*'
        url: 'https://tx.fhirlab.net/fhir'