spring:
  # Flyway: Database migration tool. HAPI FHIR JPA uses Flyway to manage
  # versioned schema migrations. However, Hibernate's hbm2ddl.auto=update
  # already handles schema creation/evolution for HAPI. Additionally, Flyway
  # Community Edition 10.x does NOT support PostgreSQL ≥15 (requires Teams/
  # Enterprise license). Disabling Flyway is safe here since Hibernate handles
  # schema management. See: hapifhir/hapi-fhir-jpaserver-starter#694
  flyway:
    enabled: false
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://db:5432/hapi
    username: admin
    password: admin
    driverClassName: org.postgresql.Driver

  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: true
      hibernate.search.backend.type: lucene
      hibernate.search.backend.analysis.configurer: ca.uhn.fhir.jpa.search.HapiHSearchAnalysisConfigurers$HapiLuceneAnalysisConfigurer
      hibernate.search.backend.directory.type: local-filesystem
      hibernate.search.backend.directory.root: /app/target/lucene_indexes
      hibernate.search.schema_management.strategy: CREATE


hapi:
  fhir:
    fhir_version: R4
    tester:
      home:
        name: PH eReferral FHIR Server
        server_address: '${PHEREF_SERVER_ADDRESS:http://localhost}:${PHEREF_SERVER_PORT:8080}/fhir'
        refuse_to_fetch_third_party_urls: false
        fhir_version: R4

    mdm_enabled: true
    mdm_rules_enabled: true
    mdm_config_json: file:/app/config/mdm-rules.json
    validate_resource_status_for_package_upload: false

    enable_repository_validating_interceptor: true
    enforce_referential_integrity_on_write: true

    validation:
      # requests_enabled MUST remain false. The RequestValidatingInterceptor
      # (old-style IServerInterceptor) fires at SERVER_INCOMING_REQUEST_POST_PROCESSED,
      # which HAPI invokes BEFORE @Hook(SERVER_INCOMING_REQUEST_PRE_HANDLED) — the
      # pointcut used by PhCoreDeduplicationInterceptor. Enabling this would validate
      # the pre-merge (stale) incoming resource before dedup runs, breaking the flow.
      # The $validate FHIR operation endpoint is always available and not gated here.
      requests_enabled: true
      # Guarantees validity on Response (Internally Validated)
      responses_enabled: false # When it hits the server in | Validation Waterfalls down and therefore it can change as a result

    subscription:
      resthook_enabled: true
      websocket_enabled: false
      email_enabled: false
    openapi_enabled: false

    logger:
      name: fhirtest.access
      format: "verb=${requestVerb} path=${servletPath} op=${operationType} opName=${operationName} resource=${idOrResourceName} remoteAddr=${remoteAddr} forwardedFor=${requestHeader.x-forwarded-for} userAgent=${requestHeader.user-agent} requestId=${requestId} params=${requestParameters} processingMs=${processingTimeMillis}"
      error_format: "verb=${requestVerb} path=${requestUrl} op=${operationType} resource=${idOrResourceName} remoteAddr=${remoteAddr} requestId=${requestId} error=${exceptionMessage}"
      log_exceptions: true

    implementationguides:
      ph_core:
        name: fhir.ph.core
        version: 0.2.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        packageUrl: https://build.fhir.org/ig/UP-Manila-SILab/ph-core/package.tgz
        fetchDependencies: true
        installResourceTypes:
          - StructureDefinition
          - SearchParameter
          - NamingSystem
          - Subscription
        dependencyExcludes:
          - "hl7.fhir.uv.extensions"
          - "hl7.fhir.uv.extensions.r4"
          - hl7.fhir.uv.extensions.r5
          - "hl7.terminology.r5"
      ph_eref:
        name: fhir.ph.ereferral
        version: 0.1.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        packageUrl: https://build.fhir.org/ig/niccoreyes/ph-ereferral/package.tgz
        fetchDependencies: true
        ## Rationale: so that the preference of the Terminologies will be from tx.fhirlab.net
        ## Not from the Implementation Guide Example 
        installResourceTypes:
          - StructureDefinition
          - SearchParameter
          - NamingSystem
          - Subscription
        dependencyExcludes:
          - "hl7.fhir.uv.extensions"
          - "hl7.fhir.uv.extensions.r4"
          - hl7.fhir.uv.extensions.r5
          - "hl7.terminology.r5"
          - "fhir.ph.core"
      hl7_extensions_r4:
        name: hl7.fhir.uv.extensions.r4
        version: 5.3.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        fetchDependencies: true
        installResourceTypes:
          - StructureDefinition
          - SearchParameter
        dependencyExcludes:
           - "hl7.terminology.r5"
           - "hl7.terminology.r4"
    logical_urls:
      - http://terminology.hl7.org/*
      - https://terminology.hl7.org/*
      - http://snomed.info/*
      - https://snomed.info/*
      - http://unitsofmeasure.org/*
      - https://unitsofmeasure.org/*
      - http://loinc.org/*
      - https://loinc.org/*
    remote_terminology_service:
      # UCUM → tx.fhir.org (tx.fhirlab.net doesn't support UCUM)
      ucum:
        system: "http://unitsofmeasure.org"
        url: "https://tx.fhir.org/r4"
      # HL7 standard terminologies → tx.fhir.org (comprehensive coverage)
      hl7:
        system: "http://terminology.hl7.org"
        url: "https://tx.fhir.org/r4"
      # LOINC → tx.fhir.org (more reliable UCUM+LOINC)
      loinc:
        system: "http://loinc.org"
        url: "https://tx.fhir.org/r4"
      # SNOMED → tx.fhirlab.net (Ontoserver)
      snomed:
        system: "https://snomed.info/sct"
        url: "https://tx.fhirlab.net/fhir"
      # PH-specific CodeSystems → tx.fhirlab.net (Ontoserver)
      phcw:
        system: "https://fhir.doh.gov.ph/phcore/CodeSystem/PHCW"
        url: "https://tx.fhirlab.net/fhir"
      psoc:
        system: "https://fhir.doh.gov.ph/phcore/CodeSystem/PSOC"
        url: "https://tx.fhirlab.net/fhir"
      psced-level:
        system: "https://psa.gov.ph/classification/psced/level"
        url: "https://tx.fhirlab.net/fhir"
      psgc:
        system: "https://psa.gov.ph/classification/psgc"
        url: "https://tx.fhirlab.net/fhir"
      psoc-unit:
        system: "https://psa.gov.ph/classification/psoc/unit"
        url: "https://tx.fhirlab.net/fhir"
      # Catch-all: everything else → tx.fhir.org
      all:
        system: "*"
        url: "https://tx.fhir.org/r4"