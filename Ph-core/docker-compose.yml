services:
  db:
    image: postgres:15
    container_name: phcore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - phcore-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  phcore-hapi:
    build: .
    image: hapi-custom:latest
    container_name: phcore-hapi
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_LOCATION: file:/app/config/
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
    volumes:
      - ./config:/app/config

volumes:
  phcore-db-data: