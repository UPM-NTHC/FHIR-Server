services:
  db:
    image: postgres:14
    container_name: phcore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - phcore-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  phcore-hapi:
    image: "hapiproject/hapi:v8.10.0-1"
    container_name: phcore-hapi
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      SPRING_CONFIG_LOCATION: file:/app/config/
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
      HAPI_FHIR_FHIR_VERSION: R4
      SPRING_FLYWAY_ENABLED: "false"
    volumes:
      - ./config:/app/config
      - ./config/mdm-rules.json:/app/config/mdm-rules.json
volumes:
  phcore-db-data:
