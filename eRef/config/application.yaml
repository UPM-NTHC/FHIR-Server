spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://db:5432/hapi
    username: admin
    password: admin
    driverClassName: org.postgresql.Driver

  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: false

hapi:
  fhir:
    fhir_version: R4
    openapi_enabled: true
    tester:
      home:
        name: PH Core FHIR Server
        server_address: 'http://localhost:8080/fhir'
        refuse_to_fetch_third_party_urls: false
        fhir_version: R4
    validate_resource_status_for_package_upload: false

    implementationguides:
      ph_core:
        name: fhir.ph.core
        version: 0.2.0
        reloadExisting: true
        installMode: STORE_AND_INSTALL
        packageUrl: https://fhirhub.telehealth.ph/IG/PH-Core/package.tgz
        fetchDependencies: true
        dependencyExcludes:
           - "hl7.fhir.uv.extensions"
           - "hl7.fhir.uv.extensions.r4"
           - "hl7.terminology.r4"
           - "fhir.ph.core"
      ph_eref:
        name: fhir.ph.ereferral
        version: 0.1.0
        reloadExisting: false
        installMode: STORE_AND_INSTALL
        packageUrl: https://build.fhir.org/ig/ph-ereferral-organization/ph-ereferral/package.tgz
        fetchDependencies: true
        dependencyExcludes:
           - "hl7.fhir.uv.extensions"
           - "hl7.fhir.uv.extensions.r4"
           - "hl7.terminology.r4"
           - "fhir.ph.core"
    logical_urls:
      - http://terminology.hl7.org/*
      - https://terminology.hl7.org/*
      - http://snomed.info/*
      - https://snomed.info/*
      - http://unitsofmeasure.org/*
      - https://unitsofmeasure.org/*
      - http://loinc.org/*
      - https://loinc.org/*
    remote_terminology_service:
      all:
        system: '*'
        url: 'https://tx.fhirlab.net/fhir'